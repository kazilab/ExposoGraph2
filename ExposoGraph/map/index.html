<style>
/* ── Reset & Base ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #f0f2f5;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --surface-3: #ebedf0;
  --border: #d0d4db;
  --text: #1a1d23;
  --text-muted: #5f6673;
  --text-faint: #8c919e;
  --teal: #01696f;
  --teal-light: #3a8a90;
  --teal-bright: #018a92;
  --red: #c9374b;
  --red-muted: #a13544;
  --orange: #d07830;
  --green: #508a2e;
  --green-muted: #3a6a1a;
  --blue: #3a75b0;
  --purple: #7c4db8;
  --gold: #c49020;
  --font-body: 'Inter', -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}

html, body { height: 100%; overflow: hidden; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

/* ── Layout ───────────────────────────────────────────────────── */
.app {
  /* Sidebar width scales with viewport, then the user can drag the splitter
     to override it. The JS resizer writes an inline --sidebar-w value. */
  --sidebar-w: clamp(280px, 22vw, 420px);
  display: grid;
  grid-template-columns: var(--sidebar-w) 5px 1fr;
  grid-template-rows: 56px 1fr;
  height: 100vh;
}

/* ── Sidebar resizer ──────────────────────────────────────────── */
.sidebar-resizer {
  grid-column: 2;
  grid-row: 2;
  background: transparent;
  cursor: col-resize;
  position: relative;
  z-index: 20;
  transition: background 0.15s;
}
.sidebar-resizer::before {
  content: "";
  position: absolute;
  inset: 0 -2px;
}
.sidebar-resizer:hover,
.sidebar-resizer.dragging { background: var(--teal-light); }
body.is-resizing { cursor: col-resize; user-select: none; }
body.is-resizing * { user-select: none !important; }

/* ── Header ───────────────────────────────────────────────────── */
.header {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  z-index: 100;
}
.header-logo {
  display: flex;
  align-items: center;
  gap: 10px;
}
.header-logo svg { flex-shrink: 0; }
.header-title {
  font-size: 14px;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
}
.header-subtitle {
  font-size: 11px;
  color: var(--text-muted);
  font-weight: 400;
}
.header-stats {
  margin-left: auto;
  display: flex;
  gap: 20px;
  font-size: 11px;
  color: var(--text-muted);
}
.header-stat b {
  color: var(--teal-bright);
  font-weight: 600;
  font-family: var(--font-mono);
}

/* ── Sidebar ──────────────────────────────────────────────────── */
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
  z-index: 10;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

.panel {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.panel-header {
  padding: 10px 12px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
  background: var(--surface-3);
}
.panel-body { padding: 10px 12px; }

/* Legend */
.legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 5px 0;
  font-size: 12px;
}
.legend-item .legend-label {
  flex: 1 1 auto;
  min-width: 0;
  line-height: 1.3;
  word-break: break-word;
}
.legend-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}
.legend-shape {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  display: block;
  overflow: visible;
}
.legend-count {
  flex-shrink: 0;
  font-size: 10px;
  font-family: var(--font-mono);
  color: var(--text-faint);
}

/* Edge legend */
.edge-legend-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 4px 0;
  font-size: 11px;
  color: var(--text-muted);
}
.edge-legend-item .legend-label {
  flex: 1 1 auto;
  min-width: 0;
  line-height: 1.3;
  word-break: break-word;
}
.edge-line {
  width: 28px;
  height: 2px;
  border-radius: 1px;
  flex-shrink: 0;
}

/* Panel headers should wrap rather than overflow when the sidebar is narrow */
.panel-header {
  white-space: normal;
  overflow-wrap: break-word;
}

/* Search */
.search-box {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.search-box input {
  background: none;
  border: none;
  outline: none;
  color: var(--text);
  font-size: 12px;
  width: 100%;
  font-family: var(--font-body);
}
.search-box input::placeholder { color: var(--text-faint); }
.search-icon { color: var(--text-faint); flex-shrink: 0; }

/* Filter buttons */
.filter-group {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}
.filter-btn {
  font-size: 10px;
  padding: 4px 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
  font-family: var(--font-body);
}
.filter-btn:hover { border-color: var(--teal-light); color: var(--text); }
.filter-btn.active {
  background: var(--teal);
  border-color: var(--teal);
  color: white;
}
.control-label {
  display: block;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-muted);
  margin-bottom: 6px;
}
.select-control,
.range-control {
  width: 100%;
}
.select-control {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 8px 10px;
  color: var(--text);
  font-size: 12px;
  font-family: var(--font-body);
  margin-bottom: 10px;
}
.range-control {
  accent-color: var(--teal);
}
.helper-text {
  margin-top: 8px;
  font-size: 11px;
  line-height: 1.45;
  color: var(--text-muted);
}

/* ── Detail Panel ─────────────────────────────────────────────── */
.detail-panel {
  display: none;
  padding: 0;
}
.detail-panel.visible { display: block; }
.detail-name {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 4px;
}
.detail-type {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  padding: 2px 6px;
  border-radius: 3px;
  display: inline-block;
  margin-bottom: 8px;
}
.detail-desc {
  font-size: 12px;
  line-height: 1.5;
  color: var(--text-muted);
  margin-bottom: 10px;
}
.detail-connections {
  font-size: 11px;
  border-top: 1px solid var(--border);
  padding-top: 8px;
}
.detail-connections h4 {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--text-faint);
  margin-bottom: 4px;
}
.conn-item {
  padding: 3px 0;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
}
.conn-item .conn-edge {
  font-family: var(--font-mono);
  font-size: 9px;
  padding: 1px 4px;
  border-radius: 2px;
}

/* ── Graph Container ──────────────────────────────────────────── */
.graph-container {
  position: relative;
  overflow: hidden;
  background: var(--bg);
  z-index: 1;
}

#graph-svg {
  width: 100%;
  height: 100%;
  cursor: grab;
}
#graph-svg:active { cursor: grabbing; }

/* ── Tooltip ──────────────────────────────────────────────────── */
.tooltip {
  position: absolute;
  padding: 10px 14px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  color: var(--text);
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.15s;
  z-index: 1000;
  max-width: 280px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.tooltip.visible { opacity: 1; }
.tooltip-title {
  font-weight: 600;
  font-size: 13px;
  margin-bottom: 4px;
}
.tooltip-type {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.tooltip-desc {
  font-size: 11px;
  line-height: 1.45;
  color: var(--text-muted);
}

/* ── Controls ─────────────────────────────────────────────────── */
.graph-controls {
  position: absolute;
  bottom: 16px;
  right: 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.ctrl-btn {
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 16px;
  transition: all 0.15s;
}
.ctrl-btn:hover { background: var(--surface-2); color: var(--text); border-color: var(--teal-light); }

/* Footer */
.graph-footer {
  position: absolute;
  bottom: 8px;
  left: 16px;
  font-size: 10px;
  color: var(--text-faint);
}
.graph-footer a { color: var(--text-faint); text-decoration: none; }
.graph-footer a:hover { color: var(--teal-light); }

/* Responsive */
@media (max-width: 768px) {
  .app { grid-template-columns: 1fr; }
  .sidebar,
  .sidebar-resizer { display: none; }
}
</style>
</head>
<body>
<div class="app">
  <!-- Header -->
  <header class="header">
    <div class="header-logo">
      <svg width="28" height="28" viewBox="0 0 32 32" fill="none" style="display:inline-block;vertical-align:middle;flex-shrink:0;width:28px;height:28px">
        <circle cx="16" cy="16" r="14" stroke="#01696F" stroke-width="2"/>
        <circle cx="10" cy="12" r="3" fill="#4f98a3" opacity="0.8"/>
        <circle cx="22" cy="12" r="2.5" fill="#e05565" opacity="0.8"/>
        <circle cx="16" cy="22" r="2.5" fill="#6daa45" opacity="0.8"/>
        <line x1="12.5" y1="13" x2="20" y2="12.5" stroke="#4f98a3" stroke-width="1" opacity="0.5"/>
        <line x1="10.5" y1="14.5" x2="15" y2="20" stroke="#6daa45" stroke-width="1" opacity="0.5"/>
        <line x1="21" y1="14" x2="17" y2="20" stroke="#e05565" stroke-width="1" opacity="0.5"/>
      </svg>
      <div>
        <div class="header-title">ExposoGraph Graph Viewer</div>
        <div class="header-subtitle" id="header-subtitle">Bundled reference graph from <code>graph-data.js</code></div>
      </div>
    </div>
    <div class="header-stats">
      <span class="header-stat"><b id="node-count">0</b> nodes</span>
      <span class="header-stat"><b id="edge-count">0</b> edges</span>
      <span class="header-stat"><b id="node-type-count">0</b> node types</span>
      <span class="header-stat"><b id="edge-type-count">0</b> edge types</span>
    </div>
  </header>

  <!-- Sidebar -->
  <aside class="sidebar">
    <!-- Search -->
    <div class="search-box">
      <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="search-input" placeholder="Search nodes...">
    </div>

    <!-- Node Legend -->
    <div class="panel" style="display: flex; flex-direction: column; max-height: 30vh;">
      <div class="panel-header">Node Types</div>
      <div class="panel-body" id="node-legend" style="overflow-y: auto; overflow-x: hidden; padding-bottom: 10px; min-height: 0;"></div>
    </div>

    <!-- Edge Legend -->
    <div class="panel" style="display: flex; flex-direction: column; max-height: 30vh;">
      <div class="panel-header">Edge Types</div>
      <div class="panel-body" id="edge-legend" style="overflow-y: auto; overflow-x: hidden; padding-bottom: 10px; min-height: 0;"></div>
    </div>

    <!-- Filtering (node type, carcinogen group, tissue threshold) is now
    driven by Streamlit widgets in ui_map_viewer.py, which recompute the
    subgraph in Python and re-render this whole document -- there is no
    client-side filter UI here anymore. Tissue dimming (`_dimmed` on nodes
    and their incident edges) is still rendered client-side; see
    resetGraphVisibility() below. -->

    <!-- Detail Panel -->
    <div class="panel detail-panel" id="detail-panel">
      <div class="panel-header">Node Details</div>
      <div class="panel-body" id="detail-content"></div>
    </div>
  </aside>

  <!-- Draggable sidebar resizer -->
  <div class="sidebar-resizer" id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-label="Resize sidebar"></div>

  <!-- Graph -->
  <div class="graph-container" id="graph-container">
    <svg id="graph-svg"></svg>
    <div class="tooltip" id="tooltip"></div>
    <div class="graph-controls">
      <button class="ctrl-btn" id="zoom-in" title="Zoom In">+</button>
      <button class="ctrl-btn" id="zoom-out" title="Zoom Out">−</button>
      <button class="ctrl-btn" id="zoom-reset" title="Reset View">⟲</button>
    </div>
    <div class="graph-footer">
      <a href="https://github.com/kazilab/ExposoGraph" target="_blank" rel="noopener noreferrer">Created with ExposoGraph</a>
       · Bundled reference viewer
    </div>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════════════════
// Knowledge Graph Visualization — D3.js Force-Directed Layout
// ═══════════════════════════════════════════════════════════════════════

const NODE_COLORS = {
  Carcinogen: "#e05565",
  Enzyme: "#4f98a3",
  Receptor: "#c74fb0",
  Gene: "#3d8b8b",
  Metabolite: "#e8945a",
  DNA_Adduct: "#a86fdf",
  Pathway: "#5591c7",
  Tissue: "#c2855a"
};

const NODE_LABELS = {
  Carcinogen: "Carcinogens (IARC-classified)",
  Enzyme: "Enzymes (Phase I/II/III + Repair)",
  Receptor: "Receptors (Nuclear/Ligand-Activated Sensors)",
  Gene: "Genes (Receptors & Variant Loci)",
  Metabolite: "Metabolites (Intermediates & Conjugates)",
  DNA_Adduct: "DNA Adducts (Lesion Types)",
  Pathway: "Pathways (KEGG References)",
  Tissue: "Tissues (Expression Context)"
};

const EDGE_COLORS = {
  // Legacy edge types (retained for backward compatibility; rarely/never
  // emitted into graph-data.json anymore -- see EdgeType in models.py)
  ACTIVATES: "#e05565",
  DETOXIFIES: "#6daa45",
  TRANSPORTS: "#5591c7",
  REPAIRS: "#e8af34",
  EXPRESSED_IN: "#c2855a",
  ENCODES: "#3d8b8b",
  CUSTOM: "#9ea9bd",
  // Directional-schema edge types actually emitted into graph-data.json
  FORMS_ADDUCT: "#a86fdf",
  PRODUCES: "#d9704a",
  DETOXIFIED_BY: "#6daa45",
  TRANSPORTED_BY: "#5591c7",
  REPAIRED_BY: "#e8af34",
  SUBSTRATE_OF: "#9b8b3f",
  AGONIZES: "#d1638f",
  INDUCES: "#4fa382",
  INHIBITS: "#a84a3c",
  TRANSFORMS_SPONTANEOUSLY: "#7d8ba1",
  MECHANISM_UNCLEAR: "#a3a3a3",
  PATHWAY: "#555b6a"
};

const EDGE_LABELS = {
  ACTIVATES: "Activates (procarcinogen → reactive metabolite)",
  DETOXIFIES: "Detoxifies (conjugation / inactivation)",
  TRANSPORTS: "Transports (efflux of conjugates)",
  REPAIRS: "Repairs (DNA damage removal)",
  EXPRESSED_IN: "Expressed in (gene → tissue)",
  ENCODES: "Encodes (variant locus → gene or enzyme)",
  CUSTOM: "Custom curated relation",
  FORMS_ADDUCT: "Forms Adduct (metabolite → DNA lesion)",
  PRODUCES: "Produces (enzyme → downstream metabolite/carcinogen)",
  DETOXIFIED_BY: "Detoxified by (compound → detoxifying enzyme)",
  TRANSPORTED_BY: "Transported by (compound → transporter enzyme)",
  REPAIRED_BY: "Repaired by (DNA lesion → repair enzyme)",
  SUBSTRATE_OF: "Substrate of (compound → metabolizing enzyme)",
  AGONIZES: "Agonizes (ligand → receptor)",
  INDUCES: "Induces (upregulates enzyme/receptor)",
  INHIBITS: "Inhibits (downregulates enzyme/receptor)",
  TRANSFORMS_SPONTANEOUSLY: "Transforms spontaneously (non-enzymatic)",
  MECHANISM_UNCLEAR: "Mechanism unclear (ambiguous pathway, dashed)",
  PATHWAY: "Pathway membership"
};

const NODE_SIZES = {
  Carcinogen: 12,
  Enzyme: 9,
  Receptor: 8,
  Gene: 8,
  Metabolite: 7,
  DNA_Adduct: 8,
  Pathway: 10,
  Tissue: 9
};

// ── Setup ────────────────────────────────────────────────────────────
const container = document.getElementById("graph-container");
const svg = d3.select("#graph-svg");
const width = container.clientWidth;
const height = container.clientHeight;

// Deep clone data
const nodes = GRAPH_DATA.nodes.map(d => ({...d}));
const edges = GRAPH_DATA.edges.map(d => ({...d}));
const DEFAULT_EDGE_OPACITY = d => d.type === "PATHWAY" ? 0.25 : 0.45;
const DEFAULT_EDGE_WIDTH = d => d.type === "PATHWAY" ? 0.8 : 1.2;
// Nodes/edges the Python side marked as below the active tissue threshold
// (GraphEngine.dim_by_tissue_threshold) render at this reduced opacity
// instead of being hidden, per the "gray out, don't remove" filter semantics.
const DIMMED_OPACITY = 0.12;

// ── Header Stats (dynamic, reflect current selection) ──────────────
const statNodeCount = document.getElementById("node-count");
const statEdgeCount = document.getElementById("edge-count");
const statNodeTypeCount = document.getElementById("node-type-count");
const statEdgeTypeCount = document.getElementById("edge-type-count");

/**
 * Update the four header counters.
 *   visibleNodeIds:    Set<string> of node ids currently "active"; null = all.
 *   visibleEdgeIndices: Set<number> of edge array indices active; null = all.
 * Type counts reflect the distinct node/edge types present in the visible set.
 */
function updateHeaderStats(visibleNodeIds = null, visibleEdgeIndices = null) {
  const activeNodes = visibleNodeIds
    ? nodes.filter(n => visibleNodeIds.has(n.id))
    : nodes;
  const activeEdges = visibleEdgeIndices
    ? edges.filter((_, i) => visibleEdgeIndices.has(i))
    : edges;
  const nodeTypes = new Set(activeNodes.map(n => n.type));
  const edgeTypes = new Set(activeEdges.map(e => e.type));
  statNodeCount.textContent = activeNodes.length;
  statEdgeCount.textContent = activeEdges.length;
  statNodeTypeCount.textContent = nodeTypes.size;
  statEdgeTypeCount.textContent = edgeTypes.size;
}

updateHeaderStats();

// ── Build Legends ────────────────────────────────────────────────────
/**
 * Build a tiny SVG glyph that mirrors the shape used for this node type on the
 * force-directed graph (diamond = Carcinogen, hexagon = DNA_Adduct,
 * rounded rect = Pathway/Tissue, circle = Enzyme/Gene/Metabolite).
 */
function buildNodeLegendGlyph(type, color) {
  const size = 18;
  const c = size / 2;
  const r = 5;
  if (type === "Carcinogen") {
    const pts = `${c},${c - r * 1.3} ${c + r},${c} ${c},${c + r * 1.3} ${c - r},${c}`;
    return `<svg class="legend-shape" viewBox="0 0 ${size} ${size}">`
      + `<polygon points="${pts}" fill="${color}" fill-opacity="0.85" `
      + `stroke="${color}" stroke-width="1.5" stroke-opacity="0.5"/></svg>`;
  }
  if (type === "DNA_Adduct") {
    const hex = d3.range(6).map(i => {
      const a = (Math.PI / 3) * i - Math.PI / 6;
      return `${c + r * Math.cos(a)},${c + r * Math.sin(a)}`;
    }).join(" ");
    return `<svg class="legend-shape" viewBox="0 0 ${size} ${size}">`
      + `<polygon points="${hex}" fill="${color}" fill-opacity="0.85" `
      + `stroke="${color}" stroke-width="1.5" stroke-opacity="0.5"/></svg>`;
  }
  if (type === "Pathway") {
    const w = r * 2.4, h = r * 1.4;
    return `<svg class="legend-shape" viewBox="0 0 ${size} ${size}">`
      + `<rect x="${c - w / 2}" y="${c - h / 2}" width="${w}" height="${h}" rx="3" `
      + `fill="${color}" fill-opacity="0.5" `
      + `stroke="${color}" stroke-width="1" stroke-opacity="0.4"/></svg>`;
  }
  if (type === "Tissue") {
    const w = r * 2.2, h = r * 1.3;
    return `<svg class="legend-shape" viewBox="0 0 ${size} ${size}">`
      + `<rect x="${c - w / 2}" y="${c - h / 2}" width="${w}" height="${h}" rx="6" `
      + `fill="${color}" fill-opacity="0.72" `
      + `stroke="${color}" stroke-width="1.3" stroke-opacity="0.45"/></svg>`;
  }
  // Enzyme / Gene / Metabolite → circle, with the same fill-opacity ladder
  const fillOp = type === "Enzyme" ? 0.85 : type === "Gene" ? 0.78 : 0.7;
  return `<svg class="legend-shape" viewBox="0 0 ${size} ${size}">`
    + `<circle cx="${c}" cy="${c}" r="${r}" fill="${color}" fill-opacity="${fillOp}" `
    + `stroke="${color}" stroke-width="1.5" stroke-opacity="0.4"/></svg>`;
}

const nodeLegend = document.getElementById("node-legend");
Object.entries(NODE_COLORS).forEach(([type, color]) => {
  const count = nodes.filter(n => n.type === type).length;
  if (count === 0) return;
  const item = document.createElement("div");
  item.className = "legend-item";
  item.dataset.type = type;
  item.innerHTML = `${buildNodeLegendGlyph(type, color)}
    <span class="legend-label">${NODE_LABELS[type]}</span>
    <span class="legend-count">${count}</span>`;
  nodeLegend.appendChild(item);
});

const edgeLegend = document.getElementById("edge-legend");
Object.entries(EDGE_COLORS).forEach(([type, color]) => {
  const count = edges.filter(e => e.type === type).length;
  if (count === 0) return;
  const item = document.createElement("div");
  item.className = "edge-legend-item";
  item.innerHTML = `<span class="edge-line" style="background:${color}"></span>
    <span class="legend-label">${EDGE_LABELS[type]}</span>
    <span class="legend-count">${count}</span>`;
  edgeLegend.appendChild(item);
});

// Node-type, carcinogen-group, and tissue-threshold filtering all happen in
// Python now (see GraphEngine.map_viewer_subgraph/dim_by_tissue_threshold and
// ui_map_viewer.py) -- this document only ever receives the already-filtered
// GRAPH_DATA it's rendering, plus a per-node/edge `_dimmed` flag for the
// tissue-threshold overlay (applied below in resetGraphVisibility()).
const headerSubtitle = document.getElementById("header-subtitle");
const tissueSourceNote = "GTEx v8 nTPM via Human Protein Atlas v25; weights are per-gene max-normalized across the bundled tissue panel.";
const tissueCaveatNote = "Colon averages sigmoid/transverse; Breast uses mammary tissue; Kidney uses cortex; Esophagus uses mucosa. GSTT1 has no bundled HPA/GTEx nTPM value.";

function updateBundleSubtitle() {
  const heavyMetalDetected = nodes.some(
    n => n.group === "Heavy Metals" || ["As", "Cr_V", "Ni2+", "Cd", "Be"].includes(n.id),
  );
  const subtitleBits = [
    `${nodes.length} nodes / ${edges.length} edges`,
    heavyMetalDetected ? "heavy-metal overlay" : "base showcase payload",
  ];
  headerSubtitle.textContent = `Bundled reference graph · ${subtitleBits.join(" · ")}`;
}

updateBundleSubtitle();

// ── D3 Force Simulation ─────────────────────────────────────────────
const g = svg.append("g");

// Zoom
const zoom = d3.zoom()
  .scaleExtent([0.15, 5])
  .on("zoom", (e) => g.attr("transform", e.transform));
svg.call(zoom);

// Arrow markers
const defs = svg.append("defs");
Object.entries(EDGE_COLORS).forEach(([type, color]) => {
  defs.append("marker")
    .attr("id", `arrow-${type}`)
    .attr("viewBox", "0 -5 10 10")
    .attr("refX", 20)
    .attr("refY", 0)
    .attr("markerWidth", 5)
    .attr("markerHeight", 5)
    .attr("orient", "auto")
    .append("path")
    .attr("d", "M0,-4L10,0L0,4")
    .attr("fill", color)
    .attr("opacity", 0.7);
});

// Links
const link = g.append("g")
  .selectAll("line")
  .data(edges)
  .join("line")
  .attr("stroke", d => EDGE_COLORS[d.type] || "#555")
  .attr("stroke-width", d => d.type === "PATHWAY" ? 0.8 : 1.2)
  .attr("stroke-opacity", d => d.type === "PATHWAY" ? 0.25 : 0.45)
  .attr("stroke-dasharray", d => d.type === "MECHANISM_UNCLEAR" ? "4,3" : null)
  .attr("marker-end", d => d.type !== "PATHWAY" ? `url(#arrow-${d.type})` : null);

// Nodes
const node = g.append("g")
  .selectAll("g")
  .data(nodes)
  .join("g")
  .call(d3.drag()
    .on("start", dragstarted)
    .on("drag", dragged)
    .on("end", dragended));

// Node shapes
node.each(function(d) {
  const el = d3.select(this);
  const r = NODE_SIZES[d.type] || 7;
  const color = NODE_COLORS[d.type] || "#888";

  if (d.type === "Carcinogen") {
    // Diamond shape for carcinogens
    el.append("polygon")
      .attr("points", `0,${-r*1.3} ${r},0 0,${r*1.3} ${-r},0`)
      .attr("fill", color)
      .attr("fill-opacity", 0.85)
      .attr("stroke", color)
      .attr("stroke-width", 1.5)
      .attr("stroke-opacity", 0.5);
  } else if (d.type === "DNA_Adduct") {
    // Hexagon for DNA adducts
    const hex = d3.range(6).map(i => {
      const a = (Math.PI / 3) * i - Math.PI / 6;
      return `${r * Math.cos(a)},${r * Math.sin(a)}`;
    }).join(" ");
    el.append("polygon")
      .attr("points", hex)
      .attr("fill", color)
      .attr("fill-opacity", 0.85)
      .attr("stroke", color)
      .attr("stroke-width", 1.5)
      .attr("stroke-opacity", 0.5);
  } else if (d.type === "Pathway") {
    // Rounded rect for pathways
    el.append("rect")
      .attr("x", -r * 1.2)
      .attr("y", -r * 0.7)
      .attr("width", r * 2.4)
      .attr("height", r * 1.4)
      .attr("rx", 3)
      .attr("fill", color)
      .attr("fill-opacity", 0.5)
      .attr("stroke", color)
      .attr("stroke-width", 1)
      .attr("stroke-opacity", 0.4);
  } else if (d.type === "Tissue") {
    // Rounded rect for tissues
    el.append("rect")
      .attr("x", -r * 1.1)
      .attr("y", -r * 0.65)
      .attr("width", r * 2.2)
      .attr("height", r * 1.3)
      .attr("rx", 6)
      .attr("fill", color)
      .attr("fill-opacity", 0.72)
      .attr("stroke", color)
      .attr("stroke-width", 1.3)
      .attr("stroke-opacity", 0.45);
  } else {
    // Circle for enzymes, genes, and metabolites
    el.append("circle")
      .attr("r", r)
      .attr("fill", color)
      .attr("fill-opacity", d.type === "Enzyme" ? 0.85 : d.type === "Gene" ? 0.78 : 0.7)
      .attr("stroke", color)
      .attr("stroke-width", 1.5)
      .attr("stroke-opacity", 0.4);
  }
});

// Node labels
node.append("text")
  .text(d => d.label)
  .attr("font-size", d => d.type === "Carcinogen" ? "10px" : d.type === "Pathway" ? "7px" : "8px")
  .attr("font-weight", d => d.type === "Carcinogen" ? "600" : "400")
  .attr("font-family", "Inter, sans-serif")
  .attr("fill", "#2a2d33")
  .attr("text-anchor", "middle")
  .attr("dy", d => (NODE_SIZES[d.type] || 7) + 12)
  .attr("paint-order", "stroke")
  .attr("stroke", "var(--bg)")
  .attr("stroke-width", 3);

// Apply the initial opacity baseline (full for ordinary nodes/edges, dimmed
// for anything the Python side flagged via _dimmed) before the simulation
// starts, rather than waiting for a search/hover interaction to trigger it.
resetGraphVisibility();

// ── Simulation ───────────────────────────────────────────────────────
const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(edges).id(d => d.id).distance(d => {
    if (d.type === "PATHWAY") return 160;
    if (d.type === "FORMS_ADDUCT") return 80;
    return 100;
  }).strength(d => d.type === "PATHWAY" ? 0.1 : 0.4))
  .force("charge", d3.forceManyBody().strength(d => {
    if (d.type === "Carcinogen") return -400;
    if (d.type === "Pathway") return -200;
    return -250;
  }))
  .force("center", d3.forceCenter(width / 2, height / 2))
  .force("collision", d3.forceCollide().radius(d => (NODE_SIZES[d.type] || 7) + 15))
  .force("x", d3.forceX(width / 2).strength(0.03))
  .force("y", d3.forceY(height / 2).strength(0.03))
  .alphaDecay(0.02)
  .on("tick", ticked);

function ticked() {
  link
    .attr("x1", d => d.source.x)
    .attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x)
    .attr("y2", d => d.target.y);

  node.attr("transform", d => `translate(${d.x},${d.y})`);
}

function resetGraphVisibility() {
  node.style("opacity", d => d._dimmed ? DIMMED_OPACITY : 1);
  link
    .style("stroke-opacity", d => d._dimmed ? DIMMED_OPACITY : DEFAULT_EDGE_OPACITY(d))
    .style("stroke-width", d => DEFAULT_EDGE_WIDTH(d));
  updateHeaderStats();
}

function normalizeString(value) {
  return String(value || "").toLowerCase();
}

function sortedTissueEntries(weights) {
  return Object.entries(weights || {}).sort((a, b) => b[1] - a[1]);
}

function formatTissueWeights(weights, preferredTissue = null, limit = 4) {
  let entries = sortedTissueEntries(weights);
  if (preferredTissue) {
    const preferred = entries.find(([name]) => name === preferredTissue);
    const others = entries.filter(([name]) => name !== preferredTissue);
    entries = preferred ? [preferred, ...others] : entries;
  }
  return entries
    .slice(0, limit)
    .map(([name, value]) => `${name} ${Number(value).toFixed(2)}`)
    .join(" · ");
}

// The only remaining client-side "view" is free-text search; everything else
// (node type, carcinogen group, tissue threshold) is decided in Python before
// this document is rendered. Re-applying the current search box value here
// restores either the active search highlight or the tissue-dimmed baseline
// (applySearch("") falls through to resetGraphVisibility()).
function restoreView() {
  applySearch(searchInput.value.toLowerCase().trim());
}

// ── Drag ─────────────────────────────────────────────────────────────
function dragstarted(event, d) {
  if (!event.active) simulation.alphaTarget(0.3).restart();
  d.fx = d.x;
  d.fy = d.y;
}
function dragged(event, d) {
  d.fx = event.x;
  d.fy = event.y;
}
function dragended(event, d) {
  if (!event.active) simulation.alphaTarget(0);
  d.fx = null;
  d.fy = null;
}

// ── Tooltip ──────────────────────────────────────────────────────────
const tooltip = document.getElementById("tooltip");

node.on("mouseover", (event, d) => {
  const color = NODE_COLORS[d.type];
  let typeExtra = "";
  if (d.type === "Enzyme") typeExtra = ` · Phase ${d.phase} · ${d.role}`;
  if (d.type === "Carcinogen") {
    const carcinogenBits = [
      d.group ? d.group.replace("_", " ") : null,
      d.iarc || null,
    ].filter(Boolean);
    if (carcinogenBits.length) typeExtra = ` · ${carcinogenBits.join(" · ")}`;
  }
  if (d.type === "Metabolite") typeExtra = ` · Reactivity: ${d.reactivity}`;
  if (d.type === "Gene") {
    const geneBits = [d.variant, d.phenotype, d.tissue].filter(Boolean);
    if (geneBits.length) typeExtra = ` · ${geneBits.join(" · ")}`;
  }
  if (d.type === "Tissue" && d.tissue) typeExtra = ` · ${d.tissue}`;
  const tissueWeightsHtml = d.tissue_weights
    ? `<div class="tooltip-desc"><b>GTEx/HPA nTPM weights:</b> ${formatTissueWeights(d.tissue_weights, null, 3)}</div>`
    : "";

  tooltip.innerHTML = `
    <div class="tooltip-title">${d.label}</div>
    <div class="tooltip-type" style="color:${color}">${d.type.replace("_"," ")}${typeExtra}</div>
    <div class="tooltip-desc">${d.detail}</div>
    ${tissueWeightsHtml}
  `;
  tooltip.classList.add("visible");

  // Highlight connected
  const connectedIds = new Set();
  connectedIds.add(d.id);
  edges.forEach(e => {
    const sid = typeof e.source === "object" ? e.source.id : e.source;
    const tid = typeof e.target === "object" ? e.target.id : e.target;
    if (sid === d.id) connectedIds.add(tid);
    if (tid === d.id) connectedIds.add(sid);
  });

  node.style("opacity", n => connectedIds.has(n.id) ? 1 : 0.1);
  link.style("stroke-opacity", e => {
    const sid = typeof e.source === "object" ? e.source.id : e.source;
    const tid = typeof e.target === "object" ? e.target.id : e.target;
    return (sid === d.id || tid === d.id) ? 0.8 : 0.03;
  }).style("stroke-width", e => {
    const sid = typeof e.source === "object" ? e.source.id : e.source;
    const tid = typeof e.target === "object" ? e.target.id : e.target;
    return (sid === d.id || tid === d.id) ? 2.5 : 0.5;
  });
})
.on("mousemove", (event) => {
  const rect = container.getBoundingClientRect();
  tooltip.style.left = (event.clientX - rect.left + 15) + "px";
  tooltip.style.top = (event.clientY - rect.top - 10) + "px";
})
.on("mouseout", () => {
  tooltip.classList.remove("visible");
  restoreView();
});

// ── Click for Details ────────────────────────────────────────────────
node.on("click", (event, d) => {
  event.stopPropagation();
  showDetail(d);
});

svg.on("click", () => {
  document.getElementById("detail-panel").classList.remove("visible");
});

function showDetail(d) {
  const panel = document.getElementById("detail-panel");
  const content = document.getElementById("detail-content");
  const color = NODE_COLORS[d.type];

  let typeLabel = d.type.replace("_", " ");
  if (d.type === "Enzyme") typeLabel += ` · Phase ${d.phase}`;
  if (d.type === "Gene" && d.variant) typeLabel += ` · ${d.variant}`;

  // Find connections
  const outgoing = [];
  const incoming = [];
  edges.forEach(e => {
    const sid = typeof e.source === "object" ? e.source.id : e.source;
    const tid = typeof e.target === "object" ? e.target.id : e.target;
    if (sid === d.id) {
      const tNode = nodes.find(n => n.id === tid);
      outgoing.push({ edge: e, node: tNode });
    }
    if (tid === d.id) {
      const sNode = nodes.find(n => n.id === sid);
      incoming.push({ edge: e, node: sNode });
    }
  });

  let connHtml = "";
  if (outgoing.length) {
    connHtml += `<h4>Outgoing (${outgoing.length})</h4>`;
    outgoing.forEach(c => {
      const ec = EDGE_COLORS[c.edge.type] || "#555";
      connHtml += `<div class="conn-item">
        <span class="conn-edge" style="background:${ec}22;color:${ec}">${c.edge.type}</span>
        → ${c.node?.label || "?"}${c.edge.label ? ` (${c.edge.label})` : ""}
      </div>`;
    });
  }
  if (incoming.length) {
    connHtml += `<h4 style="margin-top:8px">Incoming (${incoming.length})</h4>`;
    incoming.forEach(c => {
      const ec = EDGE_COLORS[c.edge.type] || "#555";
      connHtml += `<div class="conn-item">
        <span class="conn-edge" style="background:${ec}22;color:${ec}">${c.edge.type}</span>
        ← ${c.node?.label || "?"}${c.edge.label ? ` (${c.edge.label})` : ""}
      </div>`;
    });
  }

  const metadata = [
    d.group ? `<div><b>Group:</b> ${d.group.replaceAll("_", " ")}</div>` : "",
    d.iarc ? `<div><b>IARC:</b> ${d.iarc}</div>` : "",
    d.phase ? `<div><b>Phase:</b> ${d.phase}</div>` : "",
    d.role ? `<div><b>Role:</b> ${d.role}</div>` : "",
    d.reactivity ? `<div><b>Reactivity:</b> ${d.reactivity}</div>` : "",
    d.tissue ? `<div><b>Tissue:</b> ${d.tissue}</div>` : "",
    d.tissue_weights ? `<div><b>GTEx/HPA nTPM Weights:</b> ${formatTissueWeights(d.tissue_weights, null, 8)}</div>` : "",
    d.tissue_weights ? `<div><b>Tissue Data:</b> ${tissueSourceNote} ${tissueCaveatNote}</div>` : "",
    d.variant ? `<div><b>Variant:</b> ${d.variant}</div>` : "",
    d.phenotype ? `<div><b>Phenotype:</b> ${d.phenotype}</div>` : "",
    d.source_db ? `<div><b>Source DB:</b> ${d.source_db}</div>` : "",
  ].filter(Boolean).join("");

  content.innerHTML = `
    <div class="detail-name">${d.label}</div>
    <span class="detail-type" style="background:${color}22;color:${color}">${typeLabel}</span>
    <div class="detail-desc">${d.detail}</div>
    ${metadata ? `<div class="detail-desc">${metadata}</div>` : ""}
    <div class="detail-connections">${connHtml}</div>
  `;
  panel.classList.add("visible");
}

// ── Search ───────────────────────────────────────────────────────────
function applySearch(q) {
  if (!q) {
    resetGraphVisibility();
    return;
  }

  const matchIds = new Set();
  nodes.forEach(n => {
    const tissueWeightText = n.tissue_weights
      ? Object.entries(n.tissue_weights).map(([name, value]) => `${name} ${value}`).join(" ")
      : "";
    if (n.label.toLowerCase().includes(q) || n.id.toLowerCase().includes(q) ||
        (n.detail && n.detail.toLowerCase().includes(q)) ||
        (n.group && n.group.toLowerCase().includes(q)) ||
        (n.tissue && n.tissue.toLowerCase().includes(q)) ||
        tissueWeightText.toLowerCase().includes(q) ||
        (n.variant && n.variant.toLowerCase().includes(q)) ||
        (n.phenotype && n.phenotype.toLowerCase().includes(q))) {
      matchIds.add(n.id);
    }
  });

  // Also highlight connected nodes
  const expandedIds = new Set(matchIds);
  edges.forEach(e => {
    const sid = typeof e.source === "object" ? e.source.id : e.source;
    const tid = typeof e.target === "object" ? e.target.id : e.target;
    if (matchIds.has(sid)) expandedIds.add(tid);
    if (matchIds.has(tid)) expandedIds.add(sid);
  });

  const visibleEdgeIdx = new Set();
  edges.forEach((e, i) => {
    const sid = typeof e.source === "object" ? e.source.id : e.source;
    const tid = typeof e.target === "object" ? e.target.id : e.target;
    if (expandedIds.has(sid) && expandedIds.has(tid)) visibleEdgeIdx.add(i);
  });

  node.style("opacity", n => expandedIds.has(n.id) ? 1 : 0.08);
  link.style("stroke-opacity", (e, i) => visibleEdgeIdx.has(i) ? 0.6 : 0.02);

  updateHeaderStats(expandedIds, visibleEdgeIdx);
}

const searchInput = document.getElementById("search-input");
searchInput.addEventListener("input", function() {
  applySearch(this.value.toLowerCase().trim());
});

// Node-type highlighting, carcinogen-group filtering, and tissue-threshold
// filtering used to live here as client-side JS (applyTypeHighlight/
// highlightType, applyCarcinogenFilter/filterByCarcinogen, applyTissueFilter/
// filterByTissue). They have moved to Python -- GraphEngine.map_viewer_subgraph
// and GraphEngine.dim_by_tissue_threshold in engine.py -- and are now driven by
// Streamlit widgets in ui_map_viewer.py, which recompute the subgraph and
// re-render this document rather than manipulating it client-side.

// ── Sidebar Resizer ──────────────────────────────────────────────────
(function setupSidebarResizer() {
  const app = document.querySelector(".app");
  const resizer = document.getElementById("sidebar-resizer");
  if (!app || !resizer) return;

  const MIN_W = 240;
  const MAX_W = 640;
  let dragging = false;

  function setWidth(px) {
    const clamped = Math.min(MAX_W, Math.max(MIN_W, px));
    app.style.setProperty("--sidebar-w", clamped + "px");
  }

  resizer.addEventListener("pointerdown", (e) => {
    dragging = true;
    resizer.classList.add("dragging");
    document.body.classList.add("is-resizing");
    resizer.setPointerCapture(e.pointerId);
  });
  resizer.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    setWidth(e.clientX);
  });
  const endDrag = (e) => {
    if (!dragging) return;
    dragging = false;
    resizer.classList.remove("dragging");
    document.body.classList.remove("is-resizing");
    try { resizer.releasePointerCapture(e.pointerId); } catch (_) {}
    rebalanceForces();
  };
  resizer.addEventListener("pointerup", endDrag);
  resizer.addEventListener("pointercancel", endDrag);

  // Double-click to reset to the responsive default
  resizer.addEventListener("dblclick", () => {
    app.style.removeProperty("--sidebar-w");
    rebalanceForces();
  });

  // Re-center the force simulation when the graph container resizes.
  const ro = new ResizeObserver(() => rebalanceForces());
  ro.observe(container);
})();

function rebalanceForces() {
  const w = container.clientWidth;
  const h = container.clientHeight;
  if (!w || !h) return;
  simulation.force("center", d3.forceCenter(w / 2, h / 2));
  simulation.force("x", d3.forceX(w / 2).strength(0.03));
  simulation.force("y", d3.forceY(h / 2).strength(0.03));
  simulation.alpha(0.15).restart();
}

// ── Zoom Controls ────────────────────────────────────────────────────
document.getElementById("zoom-in").addEventListener("click", () => {
  svg.transition().duration(300).call(zoom.scaleBy, 1.5);
});
document.getElementById("zoom-out").addEventListener("click", () => {
  svg.transition().duration(300).call(zoom.scaleBy, 0.67);
});
document.getElementById("zoom-reset").addEventListener("click", () => {
  svg.transition().duration(500).call(zoom.transform, d3.zoomIdentity);
});

// Initial fit
setTimeout(() => {
  svg.transition().duration(800).call(
    zoom.transform,
    d3.zoomIdentity.translate(width * 0.05, height * 0.05).scale(0.85)
  );
}, 2000);

</script>
</body>
