entries:
- lifestyle_factor: current_smoking
  biomarker: urinary_1_hydroxypyrene
  matrix: urine
  reference_range:
  - 0.05
  - 0.3
  reference_units: umol_per_mol_creatinine
  partition_coefficient: 0.8
  target_tissue: Lung
  target_enzyme: CYP1A1
  carcinogen_class: PAH
  Km_uM: 0.054
  S_over_Km_central: 3.0
  S_over_Km_range:
  - 1.5
  - 8.0
  tier2_multiplier: 3.0
  references:
  - 'CDC National Exposure Report PAH metabolites: urinary 1-hydroxypyrene, NHANES
    2003-2010'
  - CDC NHANES 2003-2004 OH-PAH urine lab method (1-hydroxypyrene)
  - PMID 23885861 Bouchard & Viau 1999 urinary 1-hydroxypyrene PAH biomonitoring review
  - PMID 12376124 Viau et al. 2002 dietary PAH/1-hydroxypyrene variability caveat
  source_status: biomarker_supported; enzyme_and_Km_model_proxy
  provenance_note: Urinary 1-hydroxypyrene supports PAH/pyrene exposure, not CYP1A1-specific
    enzyme activity. CYP1A1 and Km_uM are retained as PAH activation normalization
    parameters from the flux model.
  entry_id: urinary_1_hydroxypyrene::current_smoking
