[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ExposoGraph"
version = "0.0.5"
description = "ExposoGraph — LLM-powered extraction and manual curation of carcinogen metabolism pathways"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Data analysis team @ KaziLab", email = "exposograph@kazilab.se" },
]
dependencies = [
    "matplotlib>=3.10.9",
    "nbformat>=5.10.4",
    "networkx>=3.2",
    "numpy>=1.26",
    "openpyxl>=3.1.5",
    "pandas",
    "plotly>=6.0",
    "pydantic>=2.5",
    "pyjson5>=2.0",
    "requests>=2.31",
    "seaborn>=0.13.2",
    "streamlit>=1.57.0",
]
